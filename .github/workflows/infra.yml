name: GitHub OIDC Roles

# Owns terraform/github: the two IAM roles GitHub Actions assumes
# (ctech-lbalancer-gha-haproxy, ctech-lbalancer-gha-infra) plus their policies.
# terraform/artifact is validated here but never applied by CI — it is a
# workstation-only, deploy-once root.
#
# validate needs no AWS credentials (terraform validate -backend=false only
# checks that the HCL parses). apply is the only job that assumes a role, and
# only on a push to a deploy branch, never on a pull request.
#
# Chicken-and-egg: the role this apply job assumes (ctech-lbalancer-gha-infra)
# is one of the roles this root manages. The roles were bootstrapped once from a
# workstation (see README); the "Adopt pre-existing roles" step below imports
# them into state so this root can converge them from then on without a 409
# EntityAlreadyExists.

on:
  pull_request:
    branches: [main, staging, dev]
    paths:
      - 'terraform/github/**'
      - 'terraform/artifact/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main, staging, dev]
    paths:
      - 'terraform/github/**'
      - 'terraform/artifact/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

env:
  TF_VERSION: 1.15.8
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::868899309401:role/ctech-lbalancer-gha-infra

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -recursive -check -diff terraform/

      - name: Validate roots
        run: |
          for root in terraform/github terraform/artifact; do
            echo "── $root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  apply:
    name: Apply
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply — GitHub OIDC roles
        working-directory: terraform/github
        run: |
          terraform init -input=false

          # Adopt any of this root's resources that already exist out-of-band
          # (first run, or roles bootstrapped from a workstation) so apply
          # converges them instead of failing with EntityAlreadyExists. Each
          # import is skipped when the address is already in state, and tolerated
          # when the remote object genuinely does not exist yet.
          imports="
          aws_iam_role.haproxy|ctech-lbalancer-gha-haproxy
          aws_iam_role.infra|ctech-lbalancer-gha-infra
          aws_iam_role_policy.haproxy|ctech-lbalancer-gha-haproxy:publish
          aws_iam_role_policy_attachment.infra_admin|ctech-lbalancer-gha-infra/arn:aws:iam::aws:policy/AdministratorAccess
          "
          state="$(terraform state list || true)"
          while IFS='|' read -r addr id; do
            [ -n "$addr" ] || continue
            if printf '%s\n' "$state" | grep -qxF "$addr"; then
              echo "already in state: $addr"
              continue
            fi
            echo "importing: $addr <- $id"
            terraform import -input=false "$addr" "$id" || echo "import skipped for $addr (not found remotely)"
          done <<< "$imports"

          terraform apply -auto-approve -input=false

      - name: Summarise
        working-directory: terraform/github
        run: |
          {
            echo "### GitHub OIDC roles"
            echo '```'
            terraform output -json | jq -r 'to_entries[] | "\(.key) = \(.value.value)"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
