name: Infrastructure

# validate needs no AWS credentials at all — terraform validate -backend=false
# only checks that the HCL parses. apply is the only job that assumes a role,
# and only on a push to a deploy branch, never on a pull request.

on:
  pull_request:
    branches: [main, staging, dev]
    paths:
      - 'terraform/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main, staging, dev]
    paths:
      - 'terraform/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

env:
  TF_VERSION: 1.15.8
  AWS_REGION: us-east-1
  # terraform/github's own apply is not run by this workflow — the role it
  # creates is the role this workflow assumes, so the first apply has to come
  # from the user, the same as every other terraform apply in this repo (see
  # docs/plans/2026-08-23-alpine-lbalancer-migration.md).
  ROLE_ARN: arn:aws:iam::868899309401:role/ctech-lbalancer-gha-infra

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -recursive -check -diff terraform/

      - name: Validate roots
        run: |
          for root in terraform/lbalancer terraform/github terraform/artifact; do
            echo "── $root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  apply:
    name: Apply
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve environment
        id: env
        env:
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in
            main)    echo "name=prod"  >> "$GITHUB_OUTPUT" ;;
            staging) echo "name=stage" >> "$GITHUB_OUTPUT" ;;
            *)       echo "name=dev"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # var.vpc_id has no default — variables.tf documents it as
      # "Read from /ctech/{env}/network/vpc-id (ctech-cdk NetworkStack output)",
      # so read the same parameter here rather than pinning the id in a tfvars
      # file that would drift the moment the network stack is recreated.
      - name: Resolve VPC id
        id: vpc
        env:
          ENVIRONMENT: ${{ steps.env.outputs.name }}
        run: |
          vpc_id=$(aws ssm get-parameter --name "/ctech/${ENVIRONMENT}/network/vpc-id" --query Parameter.Value --output text)
          echo "vpc_id=$vpc_id" >> "$GITHUB_OUTPUT"

      - name: Apply — GitHub OIDC roles
        working-directory: terraform/github
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Apply — lbalancer
        working-directory: terraform/lbalancer
        env:
          ENVIRONMENT: ${{ steps.env.outputs.name }}
          VPC_ID: ${{ steps.vpc.outputs.vpc_id }}
        run: |
          terraform init -input=false
          terraform workspace select -or-create "$ENVIRONMENT"
          terraform apply -auto-approve -input=false \
            -var="environment=${ENVIRONMENT}" \
            -var="vpc_id=${VPC_ID}"

      - name: Summarise
        working-directory: terraform/lbalancer
        run: |
          {
            echo "### Terraform (${{ steps.env.outputs.name }})"
            echo '```'
            terraform output -json | jq -r 'to_entries[] | "\(.key) = \(.value.value)"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
