name: Load Balancer

# Owns terraform/lbalancer: the per-environment HAProxy instance stack
# (one Terraform workspace per environment: dev / stage / prod).
#
# Independent of the GitHub OIDC Roles workflow (.github/workflows/infra.yml) —
# that root only has to have been applied once so ctech-lbalancer-gha-infra
# exists. This workflow assumes that same role but never manages it.
#
# validate needs no AWS credentials. apply assumes the role only on a push to a
# deploy branch, never on a pull request.

on:
  pull_request:
    branches: [main, staging, dev]
    paths:
      - 'terraform/lbalancer/**'
      - 'assets/**'
      - '.github/workflows/lbalancer.yml'
  push:
    branches: [main, staging, dev]
    paths:
      - 'terraform/lbalancer/**'
      - 'assets/**'
      - '.github/workflows/lbalancer.yml'

permissions:
  contents: read

env:
  TF_VERSION: 1.15.8
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::868899309401:role/ctech-lbalancer-gha-infra

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -recursive -check -diff terraform/lbalancer/

      - name: Validate
        run: |
          terraform -chdir=terraform/lbalancer init -backend=false -input=false
          terraform -chdir=terraform/lbalancer validate

  apply:
    name: Apply
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve environment
        id: env
        env:
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in
            main)    echo "name=prod"  >> "$GITHUB_OUTPUT" ;;
            staging) echo "name=stage" >> "$GITHUB_OUTPUT" ;;
            *)       echo "name=dev"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # var.vpc_id has no default — variables.tf documents it as
      # "Read from /ctech/{env}/network/vpc-id (ctech-cdk NetworkStack output)",
      # so read the same parameter here rather than pinning the id in a tfvars
      # file that would drift the moment the network stack is recreated.
      - name: Resolve VPC id
        id: vpc
        env:
          ENVIRONMENT: ${{ steps.env.outputs.name }}
        run: |
          vpc_id=$(aws ssm get-parameter --name "/ctech/${ENVIRONMENT}/network/vpc-id" --query Parameter.Value --output text)
          echo "vpc_id=$vpc_id" >> "$GITHUB_OUTPUT"

      - name: Apply — lbalancer
        working-directory: terraform/lbalancer
        env:
          ENVIRONMENT: ${{ steps.env.outputs.name }}
          VPC_ID: ${{ steps.vpc.outputs.vpc_id }}
        run: |
          terraform init -input=false
          terraform workspace select -or-create "$ENVIRONMENT"
          terraform apply -auto-approve -input=false \
            -var="environment=${ENVIRONMENT}" \
            -var="vpc_id=${VPC_ID}"

      - name: Summarise
        working-directory: terraform/lbalancer
        run: |
          {
            echo "### Terraform (${{ steps.env.outputs.name }})"
            echo '```'
            terraform output -json | jq -r 'to_entries[] | "\(.key) = \(.value.value)"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
